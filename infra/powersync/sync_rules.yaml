# What reaches clients. Single-tenant single bucket for now; when better-auth
# lands, this becomes a household-parameterized bucket (S-14 groundwork: every
# row already carries household_id).
#
# Columns are selected explicitly: server bookkeeping (column_versions — the
# per-column attribution ledger for the base_version protocol) and server-only
# tables (dead_letters) never reach clients. record_version DOES sync down —
# it is the version clients echo back as base_version on upload (S-2/S-5).
# archived_at (archive flow) and resolved_at (S-4 review queue) are NOT
# synced yet: a column clients can see locally but the server strict-rejects
# on upload is a dead-letter trap — each joins the rules WITH its write flow.
bucket_definitions:
  household:
    data:
      - SELECT id, household_id, make, model, nickname, plate, fuel_type, year, tank_capacity_l, initial_odometer_km, record_version FROM cars
      - SELECT id, household_id, car_id, reading_km, recorded_date, source, device_id, record_version FROM odometer_readings
      - SELECT id, household_id, record_table, record_id, car_id, column_name, kind, message, displaced_value, incoming_value, actor, device_id, record_version, created_at FROM flags
