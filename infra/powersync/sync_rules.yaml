# What reaches clients. Single-tenant single bucket for now; when better-auth
# lands, this becomes a household-parameterized bucket (S-14 groundwork: every
# row already carries household_id).
#
# Columns are selected explicitly: server bookkeeping (column_versions — the
# per-column attribution ledger for the base_version protocol) and server-only
# tables (dead_letters) never reach clients. record_version DOES sync down —
# it is the version clients echo back as base_version on upload (S-2/S-5).
# archived_at (archive flow) is NOT synced yet: a column clients can see
# locally but the server strict-rejects on upload is a dead-letter trap — it
# joins the rules WITH its write flow. resolved_at DID join, with the S-4
# review-queue resolve flow (D-047): `flags:PATCH` accepts the latch (and
# nothing else about a flag), so the trap is closed. flags:PUT/DELETE stay
# unhandled on purpose — a client never authors or destroys evidence.
#
# S-6 (D-046, bucket-filter): the buckets carry only LIVE rows —
# `WHERE deleted_at IS NULL`. A delete sets deleted_at server-side, the row
# leaves the bucket, and PowerSync propagates the delete as a checkpoint
# ROW-REMOVAL — no tombstone content ever reaches clients, and no
# filter-everywhere burden on client queries. A device enrolled AFTER a delete
# bootstraps only live rows, so deleted content never ships to it (H1). Undo is
# a re-INSERT (the toast closure holds the row): the server clears deleted_at,
# the row re-matches the bucket, and the checkpoint adds it back on every
# device. The cascade is atomic here too — car + children leave the bucket in
# one replication transaction → one checkpoint removes them together. Because
# deleted_at is never projected, clients have no deleted_at column at all; the
# deletion-attribution columns (deleted_by/_device/_via) also stay server-side,
# surfaced through flags. (deleted_at is still accepted-and-ignored on upload for
# robustness — a client that mirrors it must not dead-letter.)
bucket_definitions:
  household:
    data:
      - SELECT id, household_id, make, model, nickname, plate, fuel_type, year, tank_capacity_l, initial_odometer_km, record_version FROM cars WHERE deleted_at IS NULL
      - SELECT id, household_id, car_id, reading_km, recorded_date, source, device_id, record_version FROM odometer_readings WHERE deleted_at IS NULL
      - SELECT id, household_id, record_table, record_id, car_id, column_name, kind, message, displaced_value, incoming_value, actor, device_id, record_version, created_at, resolved_at FROM flags
